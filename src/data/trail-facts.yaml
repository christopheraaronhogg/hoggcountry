# MILEAGE PROVENANCE (2026-06-12): all mile values below were recalibrated
# against citation-backed official anchors (src/data/at-mile-anchors.yaml,
# ATC Data Book anchors; total updated to the ATC 2026 figure, 2197.9) via the calibrated skeleton
# (scripts/calibrate-at-mileposts.mjs; report: data/at-mile-calibration/report.md).
# Earlier values claimed AWOL 2026 citations but carried a stale ~1990s-era
# frame that drifted up to ~35 mi mid-trail. Verify against the physical
# AWOL 2026 guide where exactness matters; expected accuracy is +/- 1-3 mi.
# ============================================================================
# APPALACHIAN TRAIL FACTS DATABASE
# ============================================================================
#
# This YAML file is the SINGLE SOURCE OF TRUTH for all AT facts.
#
# CITATION POLICY:
# Every fact MUST have at least one citation. Prefer multiple sources.
# Use either singular 'citation:' or plural 'citations:' (array)
#
# Single citation:
#   citation:
#     source: AWOL
#     year: 2026
#     page: 14
#
# Multi-source citation (preferred for key facts):
#   citations:
#     - source: AWOL
#       year: 2026
#       page: 14
#     - source: ATC
#       year: 2026
#       url: https://appalachiantrail.org/...
#     - source: USGS
#       note: "Elevation verified via National Map"
#
# Valid sources: ATC | AWOL | NPS | USFS | ALDHA | USGS | MEASURED
#
# TEMPLATE SYNTAX (in master guide):
# - {{trail.total_miles}}              → 2197.9
# - {{trail.total_miles|commas}}       → 2,197.9
# - {{trail.total_miles|round}}        → 2197
# - {{landmarks.springer.elevation}}   → 3782
# - {{factbox:landmarks.blood_mountain}} → generates full fact card
# - {{table:towns.georgia}}            → generates markdown table
#
# VERIFICATION:
# - See .claude/skills/audit-trail-facts/references/SOURCES.md
# - Run /audit-trail-facts to validate
# - Update annually when new AWOL releases (January)
#
# ============================================================================

