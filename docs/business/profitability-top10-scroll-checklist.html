<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HoggCountry Profitability Dashboard v2</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Lato:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f5f2e8;
      --fg: #333333;
      --pine: #4d594a;
      --marker: #f0e000;
      --card: #ffffff;
      --border: #e6e1d4;
      --muted: #4a5448;
      --ok: #166534;
      --shadow: rgba(0,0,0,0.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Lato', system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      color: var(--fg);
      background: var(--bg);
      background-image:
        radial-gradient(900px 600px at 10% -10%, rgba(0,0,0,0.035), transparent 65%),
        radial-gradient(750px 500px at 90% 0%, rgba(0,0,0,0.025), transparent 60%);
      min-height: 100vh;
      padding: 20px 12px;
    }

    .wrap { max-width: 1180px; margin: 0 auto; display: grid; gap: 12px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; box-shadow: 0 10px 20px var(--shadow); }
    .header { padding: 16px 18px; display: grid; gap: 10px; }

    .eyebrow {
      display: inline-flex;
      width: fit-content;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid #d4cc9f;
      background: #fcf8d0;
      color: #554d00;
      font-weight: 700;
      font-size: 12px;
      letter-spacing: .03em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: 'Oswald', Impact, sans-serif;
      color: var(--pine);
      letter-spacing: .02em;
      font-size: clamp(1.35rem, 1.05rem + 1.4vw, 1.95rem);
      line-height: 1.1;
    }

    .sub {
      margin: 0;
      color: var(--muted);
      font-size: .92rem;
      line-height: 1.4;
    }

    .stats { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .stat {
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 10px;
      font-size: .84rem;
      background: #fff;
      color: var(--pine);
      font-weight: 700;
    }

    .toolbar {
      display: grid;
      gap: 8px;
      padding: 0 18px 16px;
    }

    .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

    .search {
      min-width: 260px;
      flex: 1;
      border: 1px solid #d6cfbc;
      background: #fff;
      color: #2f3b2d;
      border-radius: 10px;
      padding: 9px 11px;
      font: inherit;
      font-size: .9rem;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid #d6cfbc;
      border-radius: 999px;
      padding: 6px 10px;
      background: #fff;
      font-size: .8rem;
      color: #4c5849;
      font-weight: 700;
    }

    .chip input { accent-color: var(--ok); }

    button {
      appearance: none;
      border: 1px solid #d6cfbc;
      background: #fff;
      color: var(--pine);
      border-radius: 10px;
      padding: 7px 11px;
      font: inherit;
      font-size: .84rem;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover { border-color: #c8bfa8; transform: translateY(-1px); }
    button.primary { background: var(--marker); border-color: #dbce00; color: #2f321f; }

    .scroll {
      max-height: min(74vh, 980px);
      overflow: auto;
      padding: 10px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: linear-gradient(to bottom, rgba(255,255,255,.92), rgba(255,255,255,.96));
    }

    .phase-block {
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #fff;
      margin-bottom: 10px;
      overflow: hidden;
    }

    .phase-header {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      background: #f6f4ec;
      border-bottom: 1px solid var(--border);
      padding: 9px 11px;
      position: sticky;
      top: 0;
      z-index: 2;
    }

    .phase-title { font-family: 'Oswald', Impact, sans-serif; letter-spacing: .02em; color: #304031; font-size: 1rem; }
    .phase-count { font-size: .78rem; color: #5f6a5c; font-weight: 700; }

    .parent {
      border-top: 1px solid #eee8d8;
    }

    .parent-summary {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 8px;
      align-items: center;
      padding: 8px 11px;
      background: #fdfcf8;
      border-bottom: 1px solid #f0ebdf;
      cursor: pointer;
    }

    .rank {
      width: 26px;
      height: 26px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      border: 1px solid #c6beaa;
      background: #fff;
      color: var(--pine);
      font-family: 'Oswald', sans-serif;
      font-size: 13px;
    }

    .parent-title { margin: 0; font-size: .93rem; color: #2f3a2d; font-weight: 700; line-height: 1.25; }
    .parent-desc { margin-top: 2px; color: #60705b; font-size: .8rem; }
    .parent-meta { color: #6f7969; font-size: .75rem; font-weight: 700; }

    .task-list { list-style: none; margin: 0; padding: 8px 10px 10px 10px; display: grid; gap: 7px; }

    .task {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 9px;
      align-items: start;
      border: 1px solid #ece7da;
      border-radius: 10px;
      background: #fff;
      padding: 8px 9px;
    }

    .task input[type="checkbox"] { width: 18px; height: 18px; margin-top: 2px; accent-color: var(--ok); }
    .task-title { color: #253024; line-height: 1.3; font-size: .9rem; }
    .task-meta { margin-top: 4px; color: #6e776c; font-size: .74rem; }
    .internal-id { margin-top: 3px; color: #7f877c; font-size: .72rem; display: none; }
    .show-ids .internal-id { display: block; }
    .done .task-title { text-decoration: line-through; color: #687467; }

    .empty {
      padding: 22px;
      text-align: center;
      color: #667264;
      font-size: .92rem;
    }

    .footer-note { margin: 0; padding: 8px 4px 0; color: #626b5f; font-size: .8rem; line-height: 1.35; }

    @media (max-width: 760px) {
      .parent-summary { grid-template-columns: auto 1fr; }
      .parent-meta { grid-column: 1 / -1; }
      .search { min-width: 100%; }
    }
  </style>
</head>

lot", "criticalRank": null}, "BH-027": {"parentId": "BH-027", "title": "Launch NPS + customer wow loop post-purchase", "desc": "", "internalTitle": "Launch NPS + customer wow loop post-purchase", "criticalRank": null}, "BH-028": {"parentId": "BH-028", "title": "Build bundle engine for post-purchase cross-sell", "desc": "", "internalTitle": "Build bundle engine for post-purchase cross-sell", "criticalRank": null}, "BH-029": {"parentId": "BH-029", "title": "Automate lead/customer winback sequences", "desc": "", "internalTitle": "Automate lead/customer winback sequences", "criticalRank": null}, "BH-030": {"parentId": "BH-030", "title": "Run quarterly pricing experiments and document outcomes", "desc": "", "internalTitle": "Run quarterly pricing experiments and document outcomes", "criticalRank": null}, "BH-031": {"parentId": "BH-031", "title": "Finalize affiliate compliance + monthly revenue reporting", "desc": "", "internalTitle": "Finalize affiliate compliance + monthly revenue reporting", "criticalRank": null}, "BH-032": {"parentId": "BH-032", "title": "Publish sponsor/media kit and package page", "desc": "", "internalTitle": "Publish sponsor/media kit and package page", "criticalRank": null}, "BH-033": {"parentId": "BH-033", "title": "Create B2B licensing offer for clubs/church/groups", "desc": "", "internalTitle": "Create B2B licensing offer for clubs/church/groups", "criticalRank": null}, "BH-034": {"parentId": "BH-034", "title": "Run marketing tracking wall + weekly accountability meeting ritual", "desc": "", "internalTitle": "Run marketing tracking wall + weekly accountability meeting ritual", "criticalRank": null}, "BH-035": {"parentId": "BH-035", "title": "Implement finance controls, reconciliation, and anti-fraud guardrails", "desc": "", "internalTitle": "Implement finance controls, reconciliation, and anti-fraud guardrails", "criticalRank": null}, "BH-036": {"parentId": "BH-036", "title": "Create delegation SOP library so owner can run system, not tasks", "desc": "", "internalTitle": "Create delegation SOP library so owner can run system, not tasks", "criticalRank": null}};
    const PHASE_ORDER = ["0-14d", "15-45d", "46-90d", "90+d"];
    const PHASE_COUNTS = {"0-14d": 48, "15-45d": 33, "46-90d": 26, "90+d": 19};
    const PHASE_LABELS = {"0-14d": "Phase 0 (0-14d)", "15-45d": "Phase 1 (15-45d)", "46-90d": "Phase 2 (46-90d)", "90+d": "Phase 3 (90+d)"};

    const STORAGE_KEY = 'hoggcountry.dashboard.v2.checked';
    const STORAGE_SETTINGS = 'hoggcountry.dashboard.v2.settings';

    let checked = new Set(JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'));
    let settings = Object.assign({
      search: '',
      phases: [...PHASE_ORDER],
      top10Only: false,
      showIds: false,
      openAll: true,
    }, JSON.parse(localStorage.getItem(STORAGE_SETTINGS) || '{}'));

    const boardEl = document.getElementById('board');
    const statsEl = document.getElementById('stats');
    const phaseFiltersEl = document.getElementById('phaseFilters');

    const searchInput = document.getElementById('searchInput');
    const top10OnlyInput = document.getElementById('top10Only');
    const showIdsInput = document.getElementById('showIds');

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify([...checked]));
      localStorage.setItem(STORAGE_SETTINGS, JSON.stringify(settings));
    }

    function parentNumber(parentId) {
      const m = parentId.match(/BH-(\d{3})/);
      return m ? parseInt(m[1], 10) : 999;
    }

    function taskNumber(taskId) {
      const m = taskId.match(/\.(\d{2})$/);
      return m ? parseInt(m[1], 10) : 999;
    }

    function phaseSelected(phase) {
      return settings.phases.includes(phase);
    }

    function filteredTasks() {
      const q = (settings.search || '').trim().toLowerCase();
      return TASKS.filter(task => {
        if (!phaseSelected(task.phase)) return false;
        if (settings.top10Only && !task.criticalRank) return false;
        if (!q) return true;

        const parent = PARENTS[task.parentId] || {};
        const haystack = [
          task.title,
          task.internalTitle,
          task.owner,
          task.phaseLabel,
          parent.title || '',
          parent.internalTitle || '',
          task.id,
          task.parentId,
        ].join(' ').toLowerCase();

        return haystack.includes(q);
      });
    }

    function groupedTasks(items) {
      const phases = {};
      for (const p of PHASE_ORDER) phases[p] = {};

      for (const task of items) {
        if (!phases[task.phase]) phases[task.phase] = {};
        if (!phases[task.phase][task.parentId]) phases[task.phase][task.parentId] = [];
        phases[task.phase][task.parentId].push(task);
      }

      // sort parent groups + tasks
      for (const phase of Object.keys(phases)) {
        for (const parentId of Object.keys(phases[phase])) {
          phases[phase][parentId].sort((a, b) => taskNumber(a.id) - taskNumber(b.id));
        }
      }

      return phases;
    }

    function renderPhaseFilters() {
      phaseFiltersEl.innerHTML = PHASE_ORDER.map(phase => {
        const checkedAttr = phaseSelected(phase) ? 'checked' : '';
        const count = PHASE_COUNTS[phase] || 0;
        return `<label class="chip"><input type="checkbox" data-phase="${phase}" ${checkedAttr} /> ${PHASE_LABELS[phase] || phase} (${count})</label>`;
      }).join('');
    }

    function updateStats(visibleItems) {
      const visibleDone = visibleItems.filter(t => checked.has(t.id)).length;
      const totalVisible = visibleItems.length;
      const totalAll = TASKS.length;
      const doneAll = TASKS.filter(t => checked.has(t.id)).length;

      const pctVisible = totalVisible ? Math.round((visibleDone / totalVisible) * 100) : 0;
      const pctAll = totalAll ? Math.round((doneAll / totalAll) * 100) : 0;

      statsEl.innerHTML = `
        <span class="stat">Visible complete: <strong>${visibleDone}/${totalVisible}</strong></span>
        <span class="stat">Visible progress: <strong>${pctVisible}%</strong></span>
        <span class="stat">Overall complete: <strong>${doneAll}/${totalAll}</strong></span>
        <span class="stat">Overall progress: <strong>${pctAll}%</strong></span>
      `;
    }

    function renderBoard() {
      const items = filteredTasks();
      const grouped = groupedTasks(items);

      boardEl.classList.toggle('show-ids', !!settings.showIds);

      if (items.length === 0) {
        boardEl.innerHTML = '<div class="empty">No tasks match your current search/filter settings.</div>';
        updateStats([]);
        return;
      }

      let html = '';

      for (const phase of PHASE_ORDER) {
        const parentMap = grouped[phase] || {};
        const parentIds = Object.keys(parentMap).sort((a, b) => parentNumber(a) - parentNumber(b));
        if (!parentIds.length) continue;

        const phaseTaskCount = parentIds.reduce((sum, pid) => sum + parentMap[pid].length, 0);
        const phaseDoneCount = parentIds.reduce((sum, pid) => sum + parentMap[pid].filter(t => checked.has(t.id)).length, 0);

        html += `
          <section class="phase-block" data-phase="${phase}">
            <div class="phase-header">
              <div class="phase-title">${PHASE_LABELS[phase] || phase}</div>
              <div class="phase-count">${phaseDoneCount}/${phaseTaskCount} complete</div>
            </div>
        `;

        for (const parentId of parentIds) {
          const parent = PARENTS[parentId] || { title: parentId, internalTitle: parentId, desc: '', criticalRank: null };
          const tasks = parentMap[parentId];
          const done = tasks.filter(t => checked.has(t.id)).length;
          const total = tasks.length;
          const criticalBadge = parent.criticalRank ? `<span class="rank">${parent.criticalRank}</span>` : '<span class="rank">•</span>';

          const taskRows = tasks.map((task, idx) => {
            const isDone = checked.has(task.id);
            return `
              <li class="task ${isDone ? 'done' : ''}">
                <input type="checkbox" data-task-id="${task.id}" ${isDone ? 'checked' : ''} />
                <div>
                  <div class="task-title">${idx + 1}. ${task.title}</div>
                  <div class="task-meta">Owner: ${task.owner || '—'} · Effort: ${task.effort || '—'}</div>
                  <div class="internal-id">Task ID: ${task.id} · Parent: ${task.parentId}</div>
                </div>
              </li>
            `;
          }).join('');

          html += `
            <details class="parent" ${settings.openAll ? 'open' : ''}>
              <summary class="parent-summary">
                ${criticalBadge}
                <div>
                  <p class="parent-title">${parent.title}</p>
                  ${parent.desc ? `<div class="parent-desc">${parent.desc}</div>` : ''}
                  <div class="internal-id">Internal title: ${parent.internalTitle}</div>
                </div>
                <div class="parent-meta">${done}/${total} complete</div>
              </summary>
              <ul class="task-list">
                ${taskRows}
              </ul>
            </details>
          `;
        }

        html += '</section>';
      }

      boardEl.innerHTML = html;
      updateStats(items);
    }

    function refresh() {
      renderPhaseFilters();
      renderBoard();
      searchInput.value = settings.search || '';
      top10OnlyInput.checked = !!settings.top10Only;
      showIdsInput.checked = !!settings.showIds;
    }

    // events
    searchInput.addEventListener('input', () => {
      settings.search = searchInput.value;
      saveState();
      renderBoard();
    });

    phaseFiltersEl.addEventListener('change', (e) => {
      const target = e.target;
      if (!(target instanceof HTMLInputElement)) return;
      if (!target.dataset.phase) return;

      const phase = target.dataset.phase;
      if (target.checked) {
        if (!settings.phases.includes(phase)) settings.phases.push(phase);
      } else {
        settings.phases = settings.phases.filter(p => p !== phase);
      }

      // keep deterministic order
      settings.phases = PHASE_ORDER.filter(p => settings.phases.includes(p));
      saveState();
      refresh();
    });

    top10OnlyInput.addEventListener('change', () => {
      settings.top10Only = top10OnlyInput.checked;
      saveState();
      renderBoard();
    });

    showIdsInput.addEventListener('change', () => {
      settings.showIds = showIdsInput.checked;
      saveState();
      renderBoard();
    });

    boardEl.addEventListener('change', (e) => {
      const target = e.target;
      if (!(target instanceof HTMLInputElement)) return;
      const id = target.dataset.taskId;
      if (!id) return;

      if (target.checked) checked.add(id);
      else checked.delete(id);
      saveState();
      renderBoard();
    });

    document.getElementById('expandAllBtn').addEventListener('click', () => {
      settings.openAll = true;
      saveState();
      boardEl.querySelectorAll('details.parent').forEach(el => el.open = true);
    });

    document.getElementById('collapseAllBtn').addEventListener('click', () => {
      settings.openAll = false;
      saveState();
      boardEl.querySelectorAll('details.parent').forEach(el => el.open = false);
    });

    document.getElementById('markVisibleBtn').addEventListener('click', () => {
      for (const task of filteredTasks()) checked.add(task.id);
      saveState();
      renderBoard();
    });

    document.getElementById('clearVisibleBtn').addEventListener('click', () => {
      for (const task of filteredTasks()) checked.delete(task.id);
      saveState();
      renderBoard();
    });

    document.getElementById('resetFiltersBtn').addEventListener('click', () => {
      settings = {
        search: '',
        phases: [...PHASE_ORDER],
        top10Only: false,
        showIds: false,
        openAll: true,
      };
      saveState();
      refresh();
    });

    refresh();
  </script>
