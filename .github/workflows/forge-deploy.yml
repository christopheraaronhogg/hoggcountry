name: Forge Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Scout web and mobile PWA for Forge
        run: |
          npm run build -w @hoggcountry/scout-chatgpt-app
          SCOUT_WEB_ADAPTER=node npm run build -w @hoggcountry/scout-web
          npm --prefix mobile ci
          npm --prefix mobile run build

      - name: Set up SSH
        env:
          FORGE_SSH_PRIVATE_KEY: ${{ secrets.FORGE_SSH_PRIVATE_KEY }}
          FORGE_SSH_HOST: ${{ vars.FORGE_SSH_HOST }}
        run: |
          test -n "$FORGE_SSH_PRIVATE_KEY"
          test -n "$FORGE_SSH_HOST"
          mkdir -p ~/.ssh
          printf '%s\n' "$FORGE_SSH_PRIVATE_KEY" > ~/.ssh/forge_deploy_key
          chmod 600 ~/.ssh/forge_deploy_key
          ssh-keyscan -H "$FORGE_SSH_HOST" >> ~/.ssh/known_hosts

      - name: Prune stale Forge releases before upload
        env:
          FORGE_SSH_HOST: ${{ vars.FORGE_SSH_HOST }}
          FORGE_SSH_USER: ${{ vars.FORGE_SSH_USER }}
          FORGE_SITE_PATH: ${{ vars.FORGE_SITE_PATH }}
        run: |
          test -n "$FORGE_SSH_HOST"
          test -n "$FORGE_SITE_PATH"
          ssh -i ~/.ssh/forge_deploy_key -o IdentitiesOnly=yes "${FORGE_SSH_USER:-forge}@${FORGE_SSH_HOST}" \
            "FORGE_SITE_PATH='$FORGE_SITE_PATH' bash -s" <<'REMOTE'
          set -euo pipefail
          APP="$FORGE_SITE_PATH"
          RELEASES="$APP/releases"
          mkdir -p "$RELEASES"
          KEEP_FILE=$(mktemp)
          CUR=$(readlink -f "$APP/current" 2>/dev/null || true)
          if [ -n "$CUR" ] && [ -d "$CUR" ]; then
            printf '%s\n' "$CUR" >> "$KEEP_FILE"
          fi
          ls -1dt "$RELEASES"/* 2>/dev/null | grep -vxF "$CUR" | head -n 2 >> "$KEEP_FILE" || true
          for release in "$RELEASES"/*; do
            [ -d "$release" ] || continue
            if grep -qxF "$release" "$KEEP_FILE"; then
              echo "Keeping $release"
            else
              echo "Pruning $release"
              rm -rf "$release"
            fi
          done
          rm -f "$KEEP_FILE"
          df -h /
          REMOTE

      - name: Upload release to Forge host
        env:
          FORGE_SSH_HOST: ${{ vars.FORGE_SSH_HOST }}
          FORGE_SSH_USER: ${{ vars.FORGE_SSH_USER }}
          FORGE_SITE_PATH: ${{ vars.FORGE_SITE_PATH }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          test -n "$FORGE_SSH_HOST"
          test -n "$FORGE_SITE_PATH"
          export RELEASE="gha-${GITHUB_RUN_ID}-$(date -u +%Y%m%d%H%M%S)"
          export REMOTE="${FORGE_SSH_USER:-forge}@${FORGE_SSH_HOST}"
          export REL="${FORGE_SITE_PATH}/releases/${RELEASE}"
          ssh -i ~/.ssh/forge_deploy_key -o IdentitiesOnly=yes "$REMOTE" "mkdir -p '$REL'"
          rsync -az --delete \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude 'backend/vendor' \
            --exclude 'backend/storage' \
            -e "ssh -i ~/.ssh/forge_deploy_key -o IdentitiesOnly=yes" \
            ./ "$REMOTE:$REL/"
          echo "RELEASE=$RELEASE" >> "$GITHUB_ENV"

      - name: Activate release on Forge host
        env:
          FORGE_SSH_HOST: ${{ vars.FORGE_SSH_HOST }}
          FORGE_SSH_USER: ${{ vars.FORGE_SSH_USER }}
          FORGE_SITE_PATH: ${{ vars.FORGE_SITE_PATH }}
          GITHUB_SHA: ${{ github.sha }}
          RELEASE: ${{ env.RELEASE }}
          VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ vars.VAPID_SUBJECT }}
          SCOUT_MODEL: ${{ vars.SCOUT_MODEL }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          SCOUT_OPENAI_MODEL: ${{ vars.SCOUT_OPENAI_MODEL }}
          OPENAI_SCRIPTURE_MODEL: ${{ vars.OPENAI_SCRIPTURE_MODEL }}
        run: |
          test -n "$FORGE_SSH_HOST"
          test -n "$FORGE_SITE_PATH"
          test -n "$RELEASE"
          ssh -i ~/.ssh/forge_deploy_key -o IdentitiesOnly=yes "${FORGE_SSH_USER:-forge}@${FORGE_SSH_HOST}" \
            "GITHUB_SHA='$GITHUB_SHA' RELEASE='$RELEASE' FORGE_SITE_PATH='$FORGE_SITE_PATH' VAPID_PUBLIC_KEY='$VAPID_PUBLIC_KEY' VAPID_PRIVATE_KEY='$VAPID_PRIVATE_KEY' VAPID_SUBJECT='$VAPID_SUBJECT' SCOUT_MODEL='$SCOUT_MODEL' OPENAI_MODEL='$OPENAI_MODEL' SCOUT_OPENAI_MODEL='$SCOUT_OPENAI_MODEL' OPENAI_SCRIPTURE_MODEL='$OPENAI_SCRIPTURE_MODEL' bash -s" <<'REMOTE'
          set -euo pipefail

          APP="$FORGE_SITE_PATH"
          SHA="$GITHUB_SHA"
          REL="$APP/releases/$RELEASE"

          cd "$REL"
          ln -nfs "$APP/.env" backend/.env
          rm -rf backend/storage
          ln -nfs "$APP/storage" backend/storage
          mkdir -p backend/bootstrap/cache

          cd backend
          composer install --no-interaction --prefer-dist --optimize-autoloader
          cd ..

          rm -rf node_modules
          if [ -d "$APP/shared/node_modules" ]; then
            cp -al "$APP/shared/node_modules" node_modules
          else
            npm install --package-lock=false --omit=dev
          fi

          rm -rf node_modules/@hoggcountry
          mkdir -p node_modules/@hoggcountry
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          for (const base of ['apps', 'packages']) {
            for (const entry of fs.readdirSync(base, { withFileTypes: true })) {
              if (!entry.isDirectory()) continue;
              const manifestPath = path.join(base, entry.name, 'package.json');
              if (!fs.existsSync(manifestPath)) continue;
              const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
              if (!manifest.name?.startsWith('@hoggcountry/')) continue;
              const linkPath = path.join('node_modules', ...manifest.name.split('/'));
              fs.mkdirSync(path.dirname(linkPath), { recursive: true });
              fs.rmSync(linkPath, { recursive: true, force: true });
              fs.symlinkSync(path.join('..', '..', base, entry.name), linkPath);
            }
          }
          NODE

          test -f apps/openclaw-web/build/index.js

          update_env_var() {
            key="$1"
            value="$2"
            file="$APP/.env"
            escaped=$(printf '%s' "$value" | sed 's/[&/]/\\&/g')
            if grep -q "^${key}=" "$file"; then
              sed -i "s/^${key}=.*/${key}=${escaped}/" "$file"
            else
              printf '\n%s=%s\n' "$key" "$value" >> "$file"
            fi
          }
          update_env_var APP_BUILD_SHA "$SHA"
          update_env_var APP_BUILD_BRANCH "main"
          update_env_var APP_BUILD_TIME "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          update_env_var SCOUT_CHATGPT_APP_PROXY_ENABLED "true"
          update_env_var SCOUT_CHATGPT_APP_PROXY_ORIGIN "http://127.0.0.1:8788"
          update_env_var SCOUT_CHATGPT_APP_PORT "8788"
          update_env_var SCOUT_CHATGPT_APP_DOMAIN "https://hoggcountry.on-forge.com"
          if [ -n "${VAPID_PUBLIC_KEY:-}" ]; then
            update_env_var VAPID_PUBLIC_KEY "$VAPID_PUBLIC_KEY"
          fi
          if [ -n "${VAPID_PRIVATE_KEY:-}" ]; then
            update_env_var VAPID_PRIVATE_KEY "$VAPID_PRIVATE_KEY"
          fi
          if [ -n "${VAPID_SUBJECT:-}" ]; then
            update_env_var VAPID_SUBJECT "$VAPID_SUBJECT"
          fi
          if [ -n "${SCOUT_MODEL:-}" ]; then
            update_env_var SCOUT_MODEL "$SCOUT_MODEL"
          fi
          if [ -n "${OPENAI_MODEL:-}" ]; then
            update_env_var OPENAI_MODEL "$OPENAI_MODEL"
          fi
          if [ -n "${SCOUT_OPENAI_MODEL:-}" ]; then
            update_env_var SCOUT_OPENAI_MODEL "$SCOUT_OPENAI_MODEL"
          fi
          if [ -n "${OPENAI_SCRIPTURE_MODEL:-}" ]; then
            update_env_var OPENAI_SCRIPTURE_MODEL "$OPENAI_SCRIPTURE_MODEL"
          fi

          ln -nfs "$REL" "$APP/current"
          cd "$APP/current"
          pm2 delete hoggcountry-openclaw || true
          pm2 delete hoggcountry-scout || true
          pm2 delete hoggcountry-scout-chatgpt-app || true
          npm run forge:scout:pm2

          export SCOUT_CHATGPT_APP_PORT="$(grep -E '^SCOUT_CHATGPT_APP_PORT=' "$APP/.env" | tail -n 1 | cut -d= -f2-)"
          export SCOUT_CHATGPT_APP_PORT="${SCOUT_CHATGPT_APP_PORT:-8788}"
          smoke_scout_chatgpt_app() {
            node <<'NODE'
          const endpoint = `http://127.0.0.1:${process.env.SCOUT_CHATGPT_APP_PORT || '8788'}/mcp`;
          const payload = {
            jsonrpc: '2.0',
            id: 1,
            method: 'initialize',
            params: {
              protocolVersion: '2025-06-18',
              capabilities: {},
              clientInfo: {
                name: 'forge-activate-smoke',
                version: '1.0.0',
              },
            },
          };

          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          for (let attempt = 1; attempt <= 12; attempt += 1) {
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), 5000);

            try {
              const response = await fetch(endpoint, {
                method: 'POST',
                headers: {
                  accept: 'application/json, text/event-stream',
                  'content-type': 'application/json',
                  'user-agent': 'hoggcountry-forge-activate/1.0',
                },
                body: JSON.stringify(payload),
                signal: controller.signal,
              });
              const text = await response.text();
              if (response.status === 200 && /"name"\s*:\s*"scout-chatgpt-app"/.test(text)) {
                console.log(`Scout ChatGPT MCP loopback smoke passed on attempt ${attempt}`);
                process.exit(0);
              }
              console.error(`Scout ChatGPT MCP loopback smoke attempt ${attempt} got ${response.status}: ${text.slice(0, 400)}`);
            } catch (error) {
              console.error(`Scout ChatGPT MCP loopback smoke attempt ${attempt} failed:`, error);
            } finally {
              clearTimeout(timeout);
            }

            await sleep(1000);
          }

          process.exit(1);
          NODE
          }

          if ! smoke_scout_chatgpt_app; then
            echo "Scout ChatGPT app failed local loopback smoke after PM2 reload."
            pm2 show hoggcountry-scout-chatgpt-app || true
            pm2 logs hoggcountry-scout-chatgpt-app --lines 120 --nostream || true
            exit 1
          fi
          pm2 save

          cd "$APP/current/backend"
          php artisan optimize:clear
          php artisan config:clear
          php artisan route:clear

          KEEP_FILE=$(mktemp)
          printf '%s\n' "$REL" >> "$KEEP_FILE"
          ls -1dt "$APP"/releases/* 2>/dev/null | grep -vxF "$REL" | head -n 2 >> "$KEEP_FILE" || true
          for release in "$APP"/releases/*; do
            [ -d "$release" ] || continue
            if grep -qxF "$release" "$KEEP_FILE"; then
              echo "Keeping $release"
            else
              echo "Pruning $release"
              rm -rf "$release"
            fi
          done
          rm -f "$KEEP_FILE"
          df -h /
          REMOTE

      - name: Verify Forge deploy
        run: node scripts/verify-forge-deploy.mjs --include-mcp --base-url "${FORGE_BASE_URL:-https://hoggcountry.on-forge.com}" --expected-sha "${GITHUB_SHA}"
        env:
          FORGE_BASE_URL: ${{ vars.FORGE_BASE_URL }}
          GITHUB_SHA: ${{ github.sha }}
