# ============================================================================
# APPALACHIAN TRAIL FACTS DATABASE
# ============================================================================
#
# This YAML file is the SINGLE SOURCE OF TRUTH for all AT facts.
#
# CITATION POLICY:
# Every fact MUST have a citation. We track:
# - source: ATC | AWOL | NPS | USFS | ALDHA | MEASURED
# - year: The year the source was published/verified
# - page: (optional) Page number in printed guide
# - url: (optional) URL for online sources
#
# TEMPLATE SYNTAX (in master guide):
# - {{trail.total_miles}}              → 2197.4
# - {{trail.total_miles|commas}}       → 2,197.4
# - {{trail.total_miles|round}}        → 2197
# - {{landmarks.springer.elevation}}   → 3782
# - {{factbox:landmarks.blood_mountain}} → generates full fact card
# - {{table:towns.georgia}}            → generates markdown table
#
# MAINTENANCE:
# - Update annually when new AWOL guide releases
# - Run /audit-trail-facts to validate consistency
# - All changes should be committed with citation source
#
# ============================================================================

_meta:
  version: "2026.1.0"
  awol_edition: 2026
  last_verified: "2026-01-14"
  next_audit: "2027-01-15"
  maintainer: "hoggcountry"

# ============================================================================
# CORE TRAIL FACTS
# ============================================================================

trail:
  total_miles:
    value: 2197.4
    display: "2,197.4"
    marketing: "2,190+"
    citation:
      source: AWOL
      year: 2026
      page: 1
      note: "Official NOBO distance, Springer to Katahdin"

  approach_trail_miles:
    value: 8.8
    citation:
      source: AWOL
      year: 2026
      page: 12
      note: "Amicalola Falls to Springer Mountain summit - NOT included in AT total"

  total_elevation_gain:
    value: 464500
    unit: feet
    display: "464,500"
    citation:
      source: ATC
      year: 2026
      note: "Cumulative elevation gain NOBO"

  state_count:
    value: 14
    citation:
      source: ATC
      year: 2026

  shelter_count:
    value: 260
    approximate: true
    citation:
      source: ATC
      year: 2026
      note: "Approximately 260 shelters, count changes yearly"

  completion_rate:
    value: 0.25
