name: Mobile CI

# Fast JS gate for the Capacitor mobile app: type-check + the on-device Scout
# regression suite (node:test). Runs only when mobile/ changes so it never
# blocks unrelated website work. Native Android/iOS compiles are heavier
# (SDK/Xcode runners) and intentionally left for local/release verification.
on:
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/mobile-ci.yml']
  pull_request:
    paths: ['mobile/**', '.github/workflows/mobile-ci.yml']

jobs:
  check-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: Type-check (svelte-check)
        run: npm run check
      - name: On-device Scout regression tests
        run: npm test
