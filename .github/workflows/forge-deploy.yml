name: Forge Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.FORGE_SSH_PRIVATE_KEY }}

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer:v2
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install Forge CLI
        run: |
          composer global require laravel/forge-cli
          echo "$(composer global config bin-dir --absolute)" >> "$GITHUB_PATH"

      - name: Trigger Forge deploy
        run: |
          forge server:switch "$FORGE_SERVER_NAME"
          forge deploy "$FORGE_SITE_NAME"
        env:
          FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}
          FORGE_SERVER_NAME: ${{ vars.FORGE_SERVER_NAME }}
          FORGE_SITE_NAME: ${{ vars.FORGE_SITE_NAME }}

      - name: Verify Forge deploy
        run: node scripts/verify-forge-deploy.mjs --base-url "${FORGE_BASE_URL:-https://hoggcountry.on-forge.com}" --expected-sha "${GITHUB_SHA}"
        env:
          FORGE_BASE_URL: ${{ vars.FORGE_BASE_URL }}
