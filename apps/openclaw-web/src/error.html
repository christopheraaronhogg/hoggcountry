<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Trail not found | Hogg Country</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f5f2e8;
        color: #1f2937;
        font-family: Lato, system-ui, -apple-system, sans-serif;
        text-align: center;
      }
      main {
        display: grid;
        gap: 0.9rem;
        justify-items: center;
        max-width: 34rem;
        padding: 2rem 1rem;
      }
      .kicker {
        margin: 0;
        color: #d97706;
        font-size: 0.78rem;
        font-weight: 900;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0;
        font-family: Oswald, Impact, sans-serif;
        font-size: clamp(2rem, 7vw, 3.2rem);
        line-height: 1;
        color: #1f2937;
      }
      p.copy {
        margin: 0;
        color: #5c665a;
        line-height: 1.6;
      }
      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 0.6rem;
        justify-content: center;
      }
      a {
        display: inline-flex;
        align-items: center;
        min-height: 2.8rem;
        border: 1px solid rgba(77, 89, 74, 0.2);
        border-radius: 999px;
        padding: 0 1.1rem;
        background: rgba(255, 255, 255, 0.78);
        color: #4d594a;
        font-weight: 900;
        text-decoration: none;
      }
      a.primary {
        border: 0;
        background: #f0e000;
        color: #2b2f26;
      }
      .status {
        margin: 0.6rem 0 0;
        color: rgba(92, 102, 90, 0.6);
        font-size: 0.8rem;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="kicker">Blue blaze to nowhere</p>
      <h1>This trail doesn't go anywhere.</h1>
      <p class="copy">The page you followed isn't on our map. Back to a marked trail:</p>
      <nav>
        <a class="primary" href="/">Home</a>
        <a href="/guide">Field Guide</a>
        <a href="/at-map">AT Map</a>
        <a href="/updates">Trail Updates</a>
      </nav>
      <p class="status">%sveltekit.status% — %sveltekit.error.message%</p>
    </main>
  </body>
</html>
