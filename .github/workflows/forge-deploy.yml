name: Forge Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up SSH
        env:
          FORGE_SSH_PRIVATE_KEY: ${{ secrets.FORGE_SSH_PRIVATE_KEY }}
          FORGE_SSH_HOST: ${{ vars.FORGE_SSH_HOST }}
        run: |
          test -n "$FORGE_SSH_PRIVATE_KEY"
          test -n "$FORGE_SSH_HOST"
          mkdir -p ~/.ssh
          printf '%s\n' "$FORGE_SSH_PRIVATE_KEY" > ~/.ssh/forge_deploy_key
          chmod 600 ~/.ssh/forge_deploy_key
          ssh-keyscan -H "$FORGE_SSH_HOST" >> ~/.ssh/known_hosts

      - name: Deploy on Forge host
        env:
          FORGE_SSH_HOST: ${{ vars.FORGE_SSH_HOST }}
          FORGE_SSH_USER: ${{ vars.FORGE_SSH_USER }}
          FORGE_SITE_PATH: ${{ vars.FORGE_SITE_PATH }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          test -n "$FORGE_SSH_HOST"
          test -n "$FORGE_SITE_PATH"
          ssh -i ~/.ssh/forge_deploy_key -o IdentitiesOnly=yes "${FORGE_SSH_USER:-forge}@${FORGE_SSH_HOST}" \
            "GITHUB_SHA='$GITHUB_SHA' GITHUB_REPOSITORY='$GITHUB_REPOSITORY' FORGE_SITE_PATH='$FORGE_SITE_PATH' bash -s" <<'REMOTE'
          set -euo pipefail

          APP="$FORGE_SITE_PATH"
          SHA="$GITHUB_SHA"
          REPO="https://github.com/${GITHUB_REPOSITORY}.git"
          RELEASE="gha-${GITHUB_RUN_ID:-manual}-$(date -u +%Y%m%d%H%M%S)"
          REL="$APP/releases/$RELEASE"

          mkdir -p "$APP/releases" "$APP/shared"
          git clone --no-checkout --depth 1 "$REPO" "$REL"
          cd "$REL"
          git fetch --depth 1 origin "$SHA"
          git checkout --detach "$SHA"

          ln -nfs "$APP/.env" backend/.env
          rm -rf backend/storage
          ln -nfs "$APP/storage" backend/storage
          mkdir -p backend/bootstrap/cache

          cd backend
          composer install --no-interaction --prefer-dist --optimize-autoloader
          cd ..

          rm -rf node_modules
          if [ -d "$APP/shared/node_modules" ]; then
            cp -al "$APP/shared/node_modules" node_modules
          else
            npm install --package-lock=false
          fi

          rm -rf node_modules/@hoggcountry
          mkdir -p node_modules/@hoggcountry
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          for (const base of ['apps', 'packages']) {
            for (const entry of fs.readdirSync(base, { withFileTypes: true })) {
              if (!entry.isDirectory()) continue;
              const manifestPath = path.join(base, entry.name, 'package.json');
              if (!fs.existsSync(manifestPath)) continue;
              const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
              if (!manifest.name?.startsWith('@hoggcountry/')) continue;
              const linkPath = path.join('node_modules', ...manifest.name.split('/'));
              fs.mkdirSync(path.dirname(linkPath), { recursive: true });
              fs.rmSync(linkPath, { recursive: true, force: true });
              fs.symlinkSync(path.join('..', '..', base, entry.name), linkPath);
            }
          }
          NODE

          npm run build:openclaw:forge

          update_env_var() {
            key="$1"
            value="$2"
            file="$APP/.env"
            escaped=$(printf '%s' "$value" | sed 's/[&/]/\\&/g')
            if grep -q "^${key}=" "$file"; then
              sed -i "s/^${key}=.*/${key}=${escaped}/" "$file"
            else
              printf '\n%s=%s\n' "$key" "$value" >> "$file"
            fi
          }
          update_env_var APP_BUILD_SHA "$SHA"
          update_env_var APP_BUILD_BRANCH "main"
          update_env_var APP_BUILD_TIME "$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          rm -rf "$APP/shared/node_modules.next"
          cp -al node_modules "$APP/shared/node_modules.next"
          rm -rf "$APP/shared/node_modules.next/@hoggcountry"
          rm -rf "$APP/shared/node_modules"
          mv "$APP/shared/node_modules.next" "$APP/shared/node_modules"

          ln -nfs "$REL" "$APP/current"
          cd "$APP/current"
          pm2 delete hoggcountry-openclaw || true
          npm run forge:openclaw:pm2
          pm2 save

          cd "$APP/current/backend"
          php artisan optimize:clear
          php artisan config:clear
          php artisan route:clear

          cd "$APP/current"
          npm run verify:forge -- --expected-sha "$SHA"
          REMOTE

      - name: Verify Forge deploy from runner
        run: node scripts/verify-forge-deploy.mjs --base-url "${FORGE_BASE_URL:-https://hoggcountry.on-forge.com}" --expected-sha "${GITHUB_SHA}"
        env:
          FORGE_BASE_URL: ${{ vars.FORGE_BASE_URL }}
          GITHUB_SHA: ${{ github.sha }}
