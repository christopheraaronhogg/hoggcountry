apply plugin: 'com.android.application'

android {
    namespace "com.hoggcountry.trailassistant"
    compileSdk rootProject.ext.compileSdkVersion
    buildFeatures {
        buildConfig true
    }
    defaultConfig {
        applicationId "com.hoggcountry.trailassistant"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "0.1.0"
        buildConfigField "String", "SCOUT_GEMMA_MODEL_URL", "\"${System.getenv("SCOUT_GEMMA_MODEL_URL") ?: ""}\""
        buildConfigField "String", "SCOUT_GEMMA_MODEL_SHA256", "\"${System.getenv("SCOUT_GEMMA_MODEL_SHA256") ?: ""}\""
        buildConfigField "long", "SCOUT_GEMMA_MODEL_BYTES", "${System.getenv("SCOUT_GEMMA_MODEL_BYTES") ?: "0"}L"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            def keystoreFile = System.getenv("HC_ANDROID_KEYSTORE_FILE")
            def keystorePassword = System.getenv("HC_ANDROID_KEYSTORE_PASSWORD")
            def keyAliasValue = System.getenv("HC_ANDROID_KEY_ALIAS")
            def keyPasswordValue = System.getenv("HC_ANDROID_KEY_PASSWORD")
            if (keystoreFile && keystorePassword && keyAliasValue && keyPasswordValue) {
                storeFile file(keystoreFile)
                storePassword keystorePassword
                keyAlias keyAliasValue
                keyPassword keyPasswordValue
            }
        }
    }
    buildTypes {
        release {
            if (System.getenv("HC_ANDROID_KEYSTORE_FILE")) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')

    // --- On-device Scout (Gemma) engine ---------------------------------------
    // The ScoutGemma Capacitor plugin (src/main/java/.../scout/ScoutGemmaPlugin.java)
    // talks to ScoutGemmaEngine. Until a real engine is wired, the bundled stub
    // reports the model as unavailable and Gemma-only builds block chat rather
    // than using a paid/cloud model. MediaPipeScoutGemmaEngine is already wired
    // as a reflection-gated loader; uncomment ONE path below and configure a
    // verified model before it can activate.
    // See SCOUT_GEMMA_BRIDGE.md. No paid/cloud model APIs — inference is local.
    //
    // Path A (Maven-available today): MediaPipe LLM Inference, runs Gemma .task/.litertlm.
    //   implementation "com.google.mediapipe:tasks-genai:0.10.24"
    //   NOTE: this task may require bumping minSdkVersion to 24 (currently 23).
    //
    // Path B (forward path): LiteRT-LM direct Android artifact, once published.
    //   See https://ai.google.dev/edge/litert-lm
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
