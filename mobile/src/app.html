<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
		/>
		<!-- Installable PWA (the same build the iOS app wraps): manifest, home-screen
		     icons, and standalone meta so "Add to Home Screen" gives a native-feel app. -->
		<link rel="manifest" href="/manifest.webmanifest" />
		<meta name="theme-color" content="#f4efe4" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#10160f" media="(prefers-color-scheme: dark)" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="apple-mobile-web-app-title" content="Hogg Country" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<link rel="icon" type="image/png" href="/icon-192.png" />
		<!-- No CSP today (permissive). If one is ever added it MUST keep the map's tiles:
		     img-src 'self' data: blob: https://*.tile.opentopomap.org;
		     connect-src 'self' https://*.tile.opentopomap.org https://hoggcountry.com -->
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
