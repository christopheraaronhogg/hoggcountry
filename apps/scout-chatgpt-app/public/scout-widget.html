<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Scout Today</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #27332b;
        --muted: #5f6a5a;
        --pine: #24362c;
        --line: rgba(77, 89, 74, 0.16);
        --surface: #fffdf8;
        --soft: #eef1e8;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #f5f2e8;
        color: var(--ink);
      }

      main {
        display: grid;
        gap: 12px;
        padding: 14px;
      }

      .hero,
      .card {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
        box-shadow: 0 12px 28px rgba(31, 41, 55, 0.07);
      }

      .hero {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: end;
        gap: 12px;
        padding: 16px;
      }

      .eyebrow {
        margin: 0;
        color: var(--pine);
        font-size: 11px;
        font-weight: 900;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      h1,
      h2,
      p {
        margin: 0;
      }

      h1 {
        margin-top: 4px;
        color: #2c2116;
        font-size: clamp(44px, 16vw, 72px);
        font-weight: 950;
        letter-spacing: 0.02em;
        line-height: 0.88;
        text-transform: uppercase;
      }

      h2 {
        color: #2c2116;
        font-size: 24px;
        line-height: 1;
      }

      .route-chip {
        display: inline-flex;
        width: fit-content;
        max-width: 100%;
        margin-top: 8px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--soft);
        color: var(--muted);
        font-size: 12px;
        font-weight: 900;
        letter-spacing: 0.07em;
        padding: 6px 10px;
        text-transform: uppercase;
      }

      .mile {
        display: grid;
        gap: 2px;
        text-align: right;
      }

      .mile strong {
        color: var(--pine);
        font-size: 42px;
        letter-spacing: -0.04em;
        line-height: 0.92;
      }

      .mile span {
        color: var(--muted);
        font-size: 12px;
        font-weight: 850;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
      }

      .card {
        display: grid;
        gap: 7px;
        min-height: 96px;
        padding: 12px;
      }

      .card strong {
        color: var(--pine);
        font-size: 18px;
        font-weight: 950;
        line-height: 1.05;
        text-transform: uppercase;
      }

      .card p,
      .meta {
        color: var(--muted);
        font-size: 13px;
        font-weight: 650;
        line-height: 1.34;
      }

      .actions,
      .sources {
        display: grid;
        gap: 8px;
      }

      .actions li,
      .sources li {
        color: var(--muted);
        font-size: 13px;
        line-height: 1.35;
      }

      @media (max-width: 520px) {
        main {
          padding: 10px;
        }

        .hero {
          border-radius: 8px;
          padding: 12px;
        }

        .grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main id="app" aria-live="polite">
      <section class="hero">
        <div>
          <p class="eyebrow">Scout Today</p>
          <h1>Scout</h1>
          <span class="route-chip">Waiting for trail context</span>
        </div>
        <div class="mile">
          <span>Current mile</span>
          <strong>--</strong>
          <span>No brief yet</span>
        </div>
      </section>
    </main>

    <script type="module">
      const app = document.querySelector("#app");

      function escapeHtml(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function normalizePayload(response) {
        const structured = response?.structuredContent ?? response?.toolResult?.structuredContent ?? response;
        if (structured?.brief) return structured.brief;
        return structured;
      }

      function render(payload) {
        const brief = normalizePayload(payload);
        if (!brief || typeof brief !== "object") return;

        const cues = Array.isArray(brief.cues) ? brief.cues : [];
        const actions = Array.isArray(brief.actions) ? brief.actions : [];
        const sources = Array.isArray(brief.sourceReceipts) ? brief.sourceReceipts : [];
        const route = brief.routeLabel ?? "AT - NOBO";
        const currentMile = Number.isFinite(Number(brief.currentMile)) ? Number(brief.currentMile).toFixed(1) : "--";

        app.innerHTML = `
          <section class="hero">
            <div>
              <p class="eyebrow">Scout Today</p>
              <h1>Scout</h1>
              <span class="route-chip">${escapeHtml(route)}</span>
            </div>
            <div class="mile">
              <span>Current mile</span>
              <strong>${escapeHtml(currentMile)}</strong>
              <span>${escapeHtml(brief.phaseLabel ?? "Trail context")}</span>
            </div>
          </section>

          <section class="grid" aria-label="Trail cues">
            ${cues.map((cue) => `
              <article class="card">
                <p class="eyebrow">${escapeHtml(cue.label)}</p>
                <strong>${escapeHtml(cue.value)}</strong>
                <p>${escapeHtml(cue.detail)}</p>
              </article>
            `).join("")}
          </section>

          ${actions.length ? `
            <section class="card">
              <p class="eyebrow">Next actions</p>
              <ul class="actions">
                ${actions.map((action) => `<li>${escapeHtml(action)}</li>`).join("")}
              </ul>
            </section>
          ` : ""}

          ${sources.length ? `
            <section class="card">
              <p class="eyebrow">Sources</p>
              <ul class="sources">
                ${sources.map((source) => `<li>${escapeHtml(source.label)} - ${escapeHtml(source.status)}</li>`).join("")}
              </ul>
            </section>
          ` : ""}

          <p class="meta">Generated ${escapeHtml(brief.generatedAt ?? "now")}. Current weather, closures, water reports, and town services still need fresh confirmation before field reliance.</p>
        `;
      }

      function renderOpenAiGlobals(globals) {
        const toolOutput = globals?.toolOutput ?? window.openai?.toolOutput;
        if (toolOutput) render(toolOutput);
      }

      renderOpenAiGlobals(window.openai);
      window.addEventListener("openai:set_globals", (event) => {
        renderOpenAiGlobals(event.detail?.globals);
      }, { passive: true });

      let rpcId = 0;
      const pendingRequests = new Map();

      function rpcNotify(method, params) {
        window.parent.postMessage({ jsonrpc: "2.0", method, params }, "*");
      }

      function rpcRequest(method, params) {
        return new Promise((resolve, reject) => {
          const id = ++rpcId;
          pendingRequests.set(id, { resolve, reject });
          window.parent.postMessage({ jsonrpc: "2.0", id, method, params }, "*");
        });
      }

      window.addEventListener("message", (event) => {
        if (event.source !== window.parent) return;
        const message = event.data;
        if (!message || message.jsonrpc !== "2.0") return;

        if (typeof message.id === "number") {
          const pending = pendingRequests.get(message.id);
          if (!pending) return;
          pendingRequests.delete(message.id);
          if (message.error) pending.reject(message.error);
          else pending.resolve(message.result);
          return;
        }

        if (message.method === "ui/notifications/tool-result") {
          render(message.params);
        }
      }, { passive: true });

      async function initializeBridge() {
        await rpcRequest("ui/initialize", {
          appInfo: { name: "scout-widget", version: "0.1.0" },
          appCapabilities: {},
          protocolVersion: "2026-01-26"
        });
        rpcNotify("ui/notifications/initialized", {});
      }

      if (!window.openai) {
        initializeBridge().catch((error) => {
          console.error("Failed to initialize Scout widget bridge:", error);
        });
      }
    </script>
  </body>
</html>
