# Official AT mile anchors — the calibration source of truth for every mile
# the product displays.
#
# Each anchor pins a physical location (lat/lon ON or near the trail) to its
# official NOBO mile. The calibration pipeline
# (scripts/calibrate-at-mileposts.mjs) projects these onto the dense
# open-route geometry and interpolates everything in between. Mile markers
# change year to year: when a new AWOL/ATC edition lands, update THIS file
# and re-run the pipeline — nothing else needs to change.
#
# Provenance: researched 2026-06-12 from the 2026 ATC Data Book mileages
# (atdist.com), cross-checked against the 2023 Data Book (traildistance.com)
# and The Trek's resupply list. On 2026-09-05 the total and northern terminus
# were updated to ATC's official 2026 length, 2,197.9 miles. Existing interior
# anchors retain their individual citations and uncertainty; this is not a
# new survey of every waypoint. Regenerate web and mobile geometry together.
#
# confidence:
#   definitional — terminus; true by definition of the frame
#   high         — 2+ recent (2023-2026) sources agree within 0.5 mi
#   medium       — single recent source, or sources disagree by <= 2 mi
#   low          — best available; verify against the AWOL 2026 guide
#
# IMPORTANT: do not add anchors from memory. Every non-definitional entry
# needs citations.

frame:
  total_miles: 2197.9
  reference: ATC 2026 official total (interior anchors individually cited)
  updated: '2026-09-05'
